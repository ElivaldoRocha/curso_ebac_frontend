<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Formulário</title>
    <!-- Link para o arquivo de estilo CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Contêiner para centralizar o conteúdo -->
    <div class="form-container">
        <!-- Formulário com dois campos numéricos -->
        <form id="meuFormulario">
            <!-- Campo A -->
            <label for="campoA">Campo A:</label>
            <input type="number" id="campoA" name="campoA" required> <!-- Campo numérico obrigatório -->
            <br> <!-- Quebra de linha -->
            
            <!-- Campo B -->
            <label for="campoB">Campo B:</label>
            <input type="number" id="campoB" name="campoB" required> <!-- Campo numérico obrigatório -->
            <br> <!-- Quebra de linha -->

            <!-- Botão para submeter o formulário -->
            <button type="submit">Submeter</button>
        </form>

        <!-- Parágrafo para exibir mensagens ao usuário -->
        <p id="mensagem"></p>
    </div>

    <!-- Inclusão do arquivo JavaScript -->
    <script src="script.js"></script>
</body>
</html>
