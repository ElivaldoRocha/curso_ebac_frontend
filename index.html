<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"> <!-- Define a codificação de caracteres como UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Configura a viewport para responsividade -->
    <title>Formulário de Cadastro - Módulo 10</title> <!-- Título da página -->
    <link rel="preconnect" href="https://fonts.googleapis.com"> <!-- Preconecta ao servidor de fontes do Google -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <!-- Preconecta ao servidor de fontes com crossorigin -->
    <link href='https://fonts.googleapis.com/css?family=Roboto:wght@400;700&display=swap' rel='stylesheet'> <!-- Importa a fonte Roboto -->
    <link rel="stylesheet" href="./main.css"> <!-- Link para o arquivo CSS principal -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css" /> <!-- CSS do Slick Carousel -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css" /> <!-- Tema do Slick Carousel -->
</head>
<body>
    <header>
        <h1>Adquira seu veículo agora mesmo!</h1> <!-- Cabeçalho principal da página -->
    </header>

    <!-- Carousel de imagens -->
    <div id="carousel-imagens"> <!-- Div com o id corrigido para "carousel-imagens" -->
        <img src="./assets/slide1.png" alt="Carro da Porsche"> <!-- Imagem do primeiro slide -->
        <img src="./assets/slide2.png" alt="Carro da BMW"> <!-- Imagem do segundo slide -->
        <img src="./assets/slide3.png" alt="Carro da Ford"> <!-- Imagem do terceiro slide -->
    </div>

    <div class="container">
        <h2>Insira seus dados para finalização da compra</h2> <!-- Subtítulo da seção do formulário -->
        <form id="form"> <!-- Formulário de cadastro -->
            <div class="form-campo">
                <label for="nome">Nome completo</label> <!-- Rótulo para o campo de nome -->
                <input type="text" id="nome" name="nome" placeholder="John Doe"> <!-- Campo de entrada para nome completo -->
            </div>
            <div class="form-campo">
                <label for="email">E-mail</label> <!-- Rótulo para o campo de email -->
                <input type="email" id="email" name="email" placeholder="email@exemplo.com"> <!-- Campo de entrada para email -->
            </div>
            <div class="form-campo">
                <label for="telefone">Telefone</label> <!-- Rótulo para o campo de telefone -->
                <input type="tel" id="telefone" name="telefone"> <!-- Campo de entrada para telefone -->
            </div>
            <div class="form-campo">
                <label for="cpf">CPF</label> <!-- Rótulo para o campo de CPF -->
                <input type="text" id="cpf" name="cpf"> <!-- Campo de entrada para CPF -->
            </div>
            <div class="form-campo">
                <label for="endereco">Endereço completo</label> <!-- Rótulo para o campo de endereço -->
                <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro, cidade, estado"> <!-- Campo de entrada para endereço -->
            </div>
            <div class="form-campo">
                <label for="cep">CEP</label> <!-- Rótulo para o campo de CEP -->
                <input type="text" id="cep" name="cep"> <!-- Campo de entrada para CEP -->
            </div>
            <button type="submit">Enviar</button> <!-- Botão de envio do formulário -->
        </form>
    </div>
    <!-- Importação dos scripts necessários -->
    <script type="text/javascript" src="https://code.jquery.com/jquery-1.11.0.min.js"></script> <!-- jQuery -->
    <script type="text/javascript" src="https://code.jquery.com/jquery-migrate-1.2.1.min.js"></script> <!-- jQuery Migrate -->
    <script src="./js/jquery.mask.min.js"></script> <!-- Plugin de máscaras de input -->
    <script src="./js/jquery.validate.min.js"></script> <!-- Plugin de validação de formulários -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script> <!-- Slick Carousel -->
    <script src="./js/messages_pt_BR.min.js"></script> <!-- Mensagens de validação em português -->
    <script src="./js/main.js"></script> <!-- Script principal do projeto -->
    <!-- Inicialização do carousel -->
    <script>
        $(document).ready(function () { // Função executada quando o documento está pronto
            $('#carousel-imagens').slick({ // Inicializa o Slick Carousel na div com id "carousel-imagens"
                autoplay: true, // Ativa o autoplay
                arrows: false // Desativa as setas de navegação
            });
        });
    </script>
</body>
</html>
